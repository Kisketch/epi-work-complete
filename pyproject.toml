[project]
name = "epi-work-complete"
version = "0.1.0"
description = "Verification scripts, Arb exclusion bounds, continued-fraction certificates, and citation checks for the e+pi / spectral-gap papers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.14.0",
    "mpmath>=1.3.0",
    "python-flint>=0.9.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pymupdf>=1.24.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
