# Fast cross-platform Python & repository check workflow on ubuntu-latest.
# Runs repository link/merge integrity checks, Arb rigorous denominator selftest,
# 2026-11-25 50-digit cross-checks, SymPy/450-digit checks, and 40 verify_refs
# unit tests on every push or PR to main. (For the full Lean rebuild and
# N=512 kernel certificate audit, see lean-audit.yml.)

name: Python verification & repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: "Python certs, Arb selftest & repo integrity"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with full history (for baseline conservation checks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run verify_repo_integrity.py
        run: python verification/verify_repo_integrity.py

      - name: Run Arb rigorous denominator exclusion selftest
        run: python verification/rational_exclusion_bound_20261124.py --selftest

      - name: Run 2026-11-25 50-digit numerical cross-checks
        run: python verification/verify_evidence_numbers_20261125.py

      - name: Run SymPy and 450-digit interval checks
        run: |
          python verification/verify_round3.py
          python verification/verify_round4.py

      - name: Run offline verify_refs unit tests (40 tests)
        run: python -m unittest discover -s .agents/skills/mathodology-evidence-search/scripts -v
